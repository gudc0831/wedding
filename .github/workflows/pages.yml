name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html milano_honeymoon_guide.html .nojekyll _site/
          cp -R assets _site/assets
          rm -f _site/assets/google-maps-config.local.json

      - name: Write Google Maps config
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ secrets.GOOGLE_MAPS_MAP_ID }}
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            printf 'window.GOOGLE_MAPS_CONFIG = { apiKey: "%s", language: "ko", region: "IT", routeMapProvider: "google", googleRouteEngine: "routes", authReferrerPolicy: "origin", mapId: "%s" };\n' "$GOOGLE_MAPS_API_KEY" "${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}" > _site/assets/google-maps-config.js
          fi

      - name: Upload static files
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
