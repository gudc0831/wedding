name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html milano_honeymoon_guide.html .nojekyll _site/
          cp -R assets _site/assets
          rm -f _site/assets/google-maps-config.local.json

      - name: Write Google Maps config
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ secrets.GOOGLE_MAPS_MAP_ID || vars.GOOGLE_MAPS_MAP_ID }}
          GOOGLE_MAPS_ROUTE_ENGINE: ${{ secrets.GOOGLE_MAPS_ROUTE_ENGINE || vars.GOOGLE_MAPS_ROUTE_ENGINE || 'embed' }}
          GOOGLE_MAPS_AUTH_REFERRER_POLICY: ${{ secrets.GOOGLE_MAPS_AUTH_REFERRER_POLICY || vars.GOOGLE_MAPS_AUTH_REFERRER_POLICY }}
          GOOGLE_MAPS_PLACES_ENRICHMENT: ${{ secrets.GOOGLE_MAPS_PLACES_ENRICHMENT || vars.GOOGLE_MAPS_PLACES_ENRICHMENT || 'true' }}
          GOOGLE_MAPS_MAP_MONTHLY_LIMIT: ${{ secrets.GOOGLE_MAPS_MAP_MONTHLY_LIMIT || vars.GOOGLE_MAPS_MAP_MONTHLY_LIMIT || '990' }}
          GOOGLE_MAPS_ROUTE_COMPUTE_MONTHLY_LIMIT: ${{ secrets.GOOGLE_MAPS_ROUTE_COMPUTE_MONTHLY_LIMIT || vars.GOOGLE_MAPS_ROUTE_COMPUTE_MONTHLY_LIMIT || '990' }}
          GOOGLE_MAPS_PLACES_MONTHLY_LIMIT: ${{ secrets.GOOGLE_MAPS_PLACES_MONTHLY_LIMIT || vars.GOOGLE_MAPS_PLACES_MONTHLY_LIMIT || '990' }}
        run: |
          case "${GOOGLE_MAPS_ROUTE_ENGINE,,}" in
            routes|google-routes) export GOOGLE_MAPS_ROUTE_ENGINE=routes ;;
            *) export GOOGLE_MAPS_ROUTE_ENGINE=embed ;;
          esac
          if [ "$GOOGLE_MAPS_ROUTE_ENGINE" = "routes" ] && [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::GOOGLE_MAPS_ROUTE_ENGINE=routes requires GOOGLE_MAPS_API_KEY. Add it as a GitHub Actions Secret or Repository Variable, or leave the engine as embed."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def truthy(value):
              return str(value or "").strip().lower() in {"1", "true", "yes", "y", "on"}

          def positive_int(name, fallback):
              try:
                  value = int(str(os.environ.get(name, "")).strip())
                  return value if value > 0 else fallback
              except ValueError:
                  return fallback

          route_engine = os.environ.get("GOOGLE_MAPS_ROUTE_ENGINE", "embed")
          config = {
              "apiKey": os.environ.get("GOOGLE_MAPS_API_KEY", ""),
              "language": "ko",
              "region": "IT",
              "routeMapProvider": "google",
              "googleRouteEngine": route_engine,
              "googlePlacesEnrichment": truthy(os.environ.get("GOOGLE_MAPS_PLACES_ENRICHMENT", "true")),
              "googleMapMonthlyLimit": positive_int("GOOGLE_MAPS_MAP_MONTHLY_LIMIT", 990),
              "googleRouteComputeMonthlyLimit": positive_int("GOOGLE_MAPS_ROUTE_COMPUTE_MONTHLY_LIMIT", 990),
              "googlePlacesMonthlyLimit": positive_int("GOOGLE_MAPS_PLACES_MONTHLY_LIMIT", 990),
          }
          map_id = os.environ.get("GOOGLE_MAPS_MAP_ID", "").strip()
          if map_id:
              config["mapId"] = map_id
          elif route_engine == "routes":
              config["mapId"] = "DEMO_MAP_ID"
          auth_referrer_policy = os.environ.get("GOOGLE_MAPS_AUTH_REFERRER_POLICY", "").strip()
          if auth_referrer_policy:
              config["authReferrerPolicy"] = auth_referrer_policy

          Path("_site/assets/google-maps-config.js").write_text(
              "window.GOOGLE_MAPS_CONFIG = "
              + json.dumps(config, ensure_ascii=False, separators=(",", ":"))
              + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Upload static files
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
