<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#17372f">
  <title>Czechia, Swiss & Italy Honeymoon Guide</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Sans+KR:wght@400;700;800&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #17372f;
      font-family: "Noto Sans KR", sans-serif;
      background:
        linear-gradient(180deg, rgba(250, 246, 238, 0.86), rgba(243, 236, 222, 0.92)),
        url("./assets/cover-pattern.svg") center/cover no-repeat;
    }

    main {
      width: min(920px, 100%);
      display: grid;
      gap: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.25rem);
      line-height: 1.03;
      font-weight: 800;
    }

    p {
      margin: 0;
      color: #4b635a;
      line-height: 1.7;
      max-width: 66ch;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    a.card {
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 12px;
      padding: 22px;
      border: 1px solid rgba(23, 55, 47, 0.13);
      border-radius: 26px;
      color: #fffaf3;
      text-decoration: none;
      background: #17372f;
      box-shadow: 0 18px 46px rgba(24, 54, 47, 0.13);
      overflow: hidden;
      position: relative;
    }

    a.card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 16%, rgba(23, 55, 47, 0.78));
      z-index: 1;
    }

    a.card.czech {
      background: url("https://commons.wikimedia.org/wiki/Special:FilePath/Prague_charles_bridge_mala_strana_tower.jpg?width=1100") center/cover no-repeat;
    }

    a.card.swiss {
      background: url("https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Luzern_Kapellbruecke.jpg/1280px-Luzern_Kapellbruecke.jpg") center/cover no-repeat;
    }

    a.card.italy {
      background: url("https://www.duomomilano.it/wp-content/uploads/2023/08/duomo-fotocherchi32-scaled.jpg") center/cover no-repeat;
    }

    .card span,
    .card strong {
      position: relative;
      z-index: 2;
    }

    .card span {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card strong {
      font-size: 1.55rem;
      line-height: 1.22;
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Czechia, Swiss & Italy Honeymoon Guide</h1>
      <p>체코, 스위스, 이탈리아 일정을 독립 페이지로 나눴습니다. 체코는 출국 전 프라하 구간과 귀국 전 프라하 구간을 명확히 분리했습니다.</p>
    </div>
    <div class="cards" aria-label="나라별 일정 선택">
      <a class="card czech" href="./czech_honeymoon_guide.html">
        <span>07.11 - 07.15 · 07.26 - 07.27</span>
        <strong>체코 일정 열기</strong>
      </a>
      <a class="card swiss" href="./switzerland_honeymoon_guide.html">
        <span>07.16 - 07.21</span>
        <strong>스위스 일정 열기</strong>
      </a>
      <a class="card italy" href="./italy_honeymoon_guide.html">
        <span>07.21 - 07.26</span>
        <strong>이탈리아 일정 열기</strong>
      </a>
    </div>
  </main>
</body>
</html>
